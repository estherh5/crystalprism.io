<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script src="/slash.js"></script>
    <meta name="description" content="Create your own drawing to share with the CanvaShare community. Select different color palettes, create a unique title, and leave your mark for the world to see.">
    <meta name="keywords" content="drawing easel,drawing editor,drawing canvas,color palette,community drawing gallery">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">

    <!-- Google Fonts, Font Awesome, and project stylesheets -->
    <link href="https://fonts.googleapis.com/css?family=League+Script|Chathura|Rajdhani" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.0.13/css/all.css" integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp" rel="stylesheet" crossorigin="anonymous">
    <link href="../../fleet.css" rel="stylesheet">
    <link href="../../common.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">

    <!-- Plausible Analytics (cookieless, self-hosted) -->
    <script defer data-domain="canvashare.crystalprism.io" src="https://plausible.crystalprism.io/js/script.js"></script>

    <title>CanvaShare</title>
  </head>
  <body>
    <!-- Blank drawing and canvas -->
    <div class="hidden">
      <img id="blank" src="../images/blank-drawing.png" alt="">
      <canvas id="blank-canvas" width="400" height="400"></canvas>
    </div>

    <!-- Brush SVG used as cursor on drawing canvas -->
    <div class="hidden">
      <canvas id="brush"></canvas>
      <svg id="brush-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
        <circle id="brush-cursor" cx="10" cy="10" r="10" stroke="#000000" stroke-width="0.5">
      </svg>
    </div>

    <!-- Link to gallery -->
    <a id="gallery-link" href="../" title="Return to gallery">
      <h1 id="gallery-title" class="small">CanvaShare</h1>
      <!-- Back arrow that displays next to gallery link -->
      <i class="fas fa-undo-alt" aria-hidden="true"></i>
    </a>

    <!-- Easel container -->
    <main id="easel-container">
      <!-- Drawing title input -->
      <div id="title-input">
        <label for="drawing-title" class="visually-hidden">Drawing title</label>
        <input id="drawing-title" placeholder="[title]" maxlength="25">
      </div>

      <!-- Drawing canvas -->
      <div id="canvas-slot">
        <canvas id="canvas" width="400" height="400" aria-label="Drawing canvas"></canvas>
      </div>

      <!-- Current drawing palette -->
      <div>
        <svg id="current-palette" width="400" height="48" role="group" aria-label="Paints"></svg>
      </div>

      <!-- Palette option buttons -->
      <div id="palette-options">
        <button type="button" class="palette" data-palette="basic">Basic</button>
        <button type="button" class="palette" data-palette="pastel">Pastel</button>
        <button type="button" class="palette" data-palette="seashore">Seashore</button>
        <button type="button" class="palette" data-palette="bold">Bold</button>
        <button type="button" class="palette" data-palette="oblique">Oblique</button>
        <button type="button" class="palette" data-palette="contrast">Contrast</button>
        <button type="button" class="palette" data-palette="calico">Calico</button>
        <button type="button" class="palette" data-palette="mauve">Mauve</button>
        <button type="button" class="palette" data-palette="grayscale">Grayscale</button>
      </div>

      <!-- Drawing option buttons -->
      <div id="drawing-actions">
        <!-- Clear drawing -->
        <button id="clear" class="action" type="button">Clear</button>
        <!-- Post drawing to gallery (signed in), or a way to sign in -->
        <button id="post" class="action" type="button">Post</button>
        <a id="post-sign-in" class="action" hidden>Sign in to post</a>
        <!-- Download drawing -->
        <a id="download-link">
          <button id="download" class="action" type="button">Download</button>
        </a>
      </div>

    </main>

    <!-- Fetch polyfill script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fetch/2.0.3/fetch.min.js"></script>

    <!-- EaselJS script -->
    <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>

    <!-- Snap.svg script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.4.1/snap.svg-min.js"></script>

    <!-- canvg script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/canvg/dist/browser/canvg.min.js"></script>

    <!-- Main and common JS scripts -->
    <script src="../../fleet-menu.js"></script>
    <script src="../../common.js"></script>
    <script src="../ui.js"></script>
    <script src="main.js"></script>

  </body>
</html>
