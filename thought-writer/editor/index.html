<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script src="/slash.js"></script>
    <meta name="description" content="Create a public post to share with the world, or write a private post that only you can see. Open your cabinet to see all of the posts you have written, make changes, or delete posts.">
    <meta name="keywords" content="post editor,private posts,public posts,thought posts">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">

    <!-- Google Fonts, Font Awesome and project stylesheets -->
    <link href="https://fonts.googleapis.com/css?family=Cutive+Mono|Material+Icons|Rajdhani|Share" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.0.13/css/all.css" integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp" rel="stylesheet" crossorigin="anonymous">
    <link href="../../fleet.css" rel="stylesheet">
    <link href="../../common.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">

    <!-- Plausible Analytics (cookieless, self-hosted) -->
    <script defer data-domain="thought-writer.crystalprism.io" src="https://plausible.crystalprism.io/js/script.js"></script>

    <title>Thought Writer</title>
  </head>
  <body>
    <!-- Page title -->
    <a id="title-link" href="../" title="Return to post board">
      <h1 id="title">Thought Writer</h1>
    </a>

    <!-- Main page container -->
    <main id="editor-container">

      <!-- Post editing space -->
      <div id="edit-space">

        <!-- Input for post title -->
        <label for="post-title" class="visually-hidden">Post title</label>
        <input id="post-title" placeholder="[title]" maxlength="25">

        <!-- Pink post background -->
        <div id="post-background">

          <!-- Toolbar for post editing (buttons with data-commands and icons) -->
          <div id="format-toolbar">
            <button id="font-color-icon" type="button" aria-label="Text color" title="Text color">
              <input id="font-color-picker" class="jscolor" data-command="foreColor" tabindex="-1" aria-hidden="true">
              <i class="material-icons">format_color_text</i>
            </button>
            <button type="button" data-command="removeFormat" aria-label="Clear formatting" title="Clear formatting">
              <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="bold" aria-label="Bold" title="Bold">
              <i class="fas fa-bold" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="italic" aria-label="Italic" title="Italic">
              <i class="fas fa-italic" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="underline" aria-label="Underline" title="Underline">
              <i class="fas fa-underline" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="strikeThrough" aria-label="Strikethrough" title="Strikethrough">
              <i class="fas fa-strikethrough" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="subscript" aria-label="Subscript" title="Subscript">
              <i class="fas fa-subscript" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="superscript" aria-label="Superscript" title="Superscript">
              <i class="fas fa-superscript" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="justifyLeft" aria-label="Align left" title="Align left">
              <i class="fas fa-align-left" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="justifyCenter" aria-label="Align center" title="Align center">
              <i class="fas fa-align-center" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="justifyRight" aria-label="Align right" title="Align right">
              <i class="fas fa-align-right" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="justifyFull" aria-label="Justify" title="Justify">
              <i class="fas fa-align-justify" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list">
              <i class="fas fa-list-ol" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">
              <i class="fas fa-list-ul" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="createLink" aria-label="Insert link" title="Insert link">
              <i class="fas fa-link" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="unlink" aria-label="Remove link" title="Remove link">
              <i class="fas fa-unlink" aria-hidden="true"></i>
            </button>
            <button type="button" data-command="insertImage" aria-label="Insert image" title="Insert image">
              <i class="far fa-file-image" aria-hidden="true"></i>
            </button>
          </div>

          <!-- Contenteditable div for post writing -->
          <div id="post-content" contenteditable role="textbox" aria-multiline="true" aria-label="Post"></div>

          <!-- Post action buttons -->
          <div id="action-buttons">
            <button id="clear-post" class="action-button" type="button">Clear</button>
            <button id="submit-post" class="action-button" type="button">Submit</button>
            <a id="post-sign-in" class="action-button">Sign in to post</a>
            <button id="close-post" class="action-button" type="button">Close</button>
            <button id="modify-post" class="action-button" type="button">Modify</button>
            <button id="delete-post" class="action-button" type="button">Delete</button>
            <!-- Custom checkbox for setting post to public -->
            <div id="public-checkbox"></div>
            <text id="public-text">Public?</text>
            <!-- Hidden input for setting post to public -->
            <input id="public-input" type="checkbox" checked="false">
          </div>

          <!-- Post buttons that appear after post is written or modified -->
          <button id="go-board" class="action-button" type="button">Go to Public Post Board</button>
          <button id="go-back" class="action-button" type="button">Modify Last Post</button>
          <button id="continue-post" class="action-button" type="button">Continue In-Progress Post</button>
          <button id="new-post" class="action-button" type="button">New Post</button>

        </div>
      </div>

      <!-- Cabinet that displays user's previous posts -->
      <div id="cabinet">
        <div id="cabinet-back">
          <!-- Left arrow that appears when browsing through posts -->
          <i id="left-arrow" class="fas fa-angle-double-left"></i>
        </div>
        <!-- Container where previous posts are loaded from server -->
        <div id="posts-container"></div>
        <div id="cabinet-front">
          <!-- Cabinet handle that user clicks to open/close cabinet -->
          <div id="handle" title="Click to see the posts you have written">My Posts</div>
          <!-- Right arrow that appears when browsing through posts -->
          <i id="right-arrow" class="fas fa-angle-double-right"></i>
        </div>
      </div>

    </main>

    <!-- Fetch polyfill script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fetch/2.0.3/fetch.min.js"></script>

    <!-- Moment.js script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.20.0/moment.min.js"></script>

    <!-- jscolor script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jscolor/2.0.4/jscolor.min.js"></script>

    <!-- DOMPurify script (sanitises stored post and comment bodies; see common.js#setRichText) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js" integrity="sha512-flQmhkXNRQ3iUfvtdCobtpMjCb6kE+zLnTiAulAQJ3WykVfy84JvCMOo6vhwWXHTXjR25h9Zj+LyGFRWKjRoag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Main and common JS scripts -->
    <script src="../../fleet-menu.js"></script>
    <script src="../../common.js"></script>
    <script src="../ui.js"></script>
    <script src="main.js"></script>

  </body>
</html>
